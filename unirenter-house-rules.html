<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>House Rules — UniRenter</title>
  <meta name="description" content="Household agreement shared via UniRenter.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy:        #0d1f2d;
      --navy-card:   #142030;
      --brand-yellow: #F5B800;
      --brand-coral:  #E8623A;
      --brand-blue:   #4BBFE0;
      --brand-green:  #3DAA5C;
      --text-primary: #e8edf2;
      --text-muted:   rgba(232,237,242,0.55);
      --border:       rgba(255,255,255,0.09);
    }
    body {
      background: var(--navy);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      min-height: 100vh;
    }
    /* Nav */
    nav {
      background: rgba(13,31,45,0.97);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .nav-logo {
      font-family: 'Epilogue', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #fff;
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .nav-logo span { color: var(--brand-yellow); }
    .nav-cta {
      background: var(--brand-yellow);
      color: #0d1f2d;
      font-weight: 700;
      font-size: 13px;
      padding: 7px 16px;
      border-radius: 8px;
      text-decoration: none;
      transition: opacity 0.15s;
    }
    .nav-cta:hover { opacity: 0.88; }

    /* Page */
    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 32px 16px 80px;
    }

    /* Loading / error */
    .state-card {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
    .state-icon { font-size: 36px; margin-bottom: 14px; }

    /* Header */
    .ag-header {
      background: linear-gradient(135deg, rgba(20,32,48,0.9), rgba(13,31,45,0.95));
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px 20px;
      margin-bottom: 24px;
    }
    .ag-header-top {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }
    .ag-header-icon { font-size: 32px; flex-shrink: 0; }
    .ag-header-title {
      font-family: 'Epilogue', sans-serif;
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      line-height: 1.2;
    }
    .ag-header-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .ag-locked-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(61,170,92,0.12);
      border: 1px solid rgba(61,170,92,0.3);
      color: var(--brand-green);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 14px;
    }
    .ag-members-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 4px;
    }
    .ag-member-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .ag-member-emoji { font-size: 14px; }

    /* Disclaimer */
    .ag-disclaimer {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
      font-style: italic;
    }
    .ag-disclaimer strong { color: var(--text-primary); font-style: normal; }

    /* Clause sections */
    .ag-section-head {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin: 20px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }
    .ag-clause-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(61,170,92,0.2);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 8px;
    }
    .ag-clause-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 6px;
    }
    .ag-clause-emoji { font-size: 16px; flex-shrink: 0; }
    .ag-clause-title { font-size: 14px; font-weight: 600; color: var(--text-primary); }
    .ag-clause-value {
      font-size: 13px;
      color: var(--text-muted);
      padding-left: 26px;
      line-height: 1.6;
    }
    .ag-no-value { color: rgba(255,255,255,0.2); font-style: italic; font-size: 12px; }

    /* Share strip */
    .ag-share-strip {
      background: rgba(75,191,224,0.06);
      border: 1px solid rgba(75,191,224,0.18);
      border-radius: 12px;
      padding: 16px;
      margin-top: 32px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .ag-share-strip-icon { font-size: 22px; }
    .ag-share-strip-body { flex: 1; min-width: 180px; }
    .ag-share-strip-title { font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
    .ag-share-strip-sub { font-size: 12px; color: var(--text-muted); }
    .ag-copy-btn {
      background: none;
      border: 1px solid rgba(75,191,224,0.35);
      color: var(--brand-blue);
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .ag-copy-btn:hover { background: rgba(75,191,224,0.08); }

    /* CTA footer */
    .ag-cta-footer {
      margin-top: 32px;
      text-align: center;
      padding: 24px 16px;
      background: rgba(245,184,0,0.05);
      border: 1px solid rgba(245,184,0,0.15);
      border-radius: 12px;
    }
    .ag-cta-footer p { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
    .ag-cta-footer a {
      display: inline-block;
      background: var(--brand-yellow);
      color: #0d1f2d;
      font-weight: 700;
      font-size: 14px;
      padding: 11px 24px;
      border-radius: 8px;
      text-decoration: none;
    }
    .ag-cta-footer a:hover { opacity: 0.88; }

    /* UniRenter promo footer */
    .page-footer {
      margin-top: 48px;
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
      padding-bottom: 24px;
    }
    .page-footer a { color: rgba(255,255,255,0.35); text-decoration: none; }

    /* House Vibe block */
    .hv-block {
      background: linear-gradient(135deg, rgba(75,191,224,0.06), rgba(13,31,45,0.4));
      border: 1px solid rgba(75,191,224,0.2);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .hv-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--brand-blue);
      margin-bottom: 12px;
    }
    .hv-equation {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }
    .hv-member-eq {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 11px;
      font-size: 19px;
      line-height: 1;
    }
    .hv-member-name {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 5px;
      font-weight: 500;
    }
    .hv-divider {
      font-size: 14px;
      color: var(--text-muted);
      opacity: 0.4;
      margin: 0 2px;
    }
    .hv-summary {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      line-height: 1.5;
      min-height: 18px;
    }
    .hv-cob-credit {
      font-size: 11px;
      color: rgba(255,255,255,0.2);
      margin-top: 8px;
    }
    .hv-nudge {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(75,191,224,0.12);
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .hv-nudge-icon { font-size: 18px; flex-shrink: 0; margin-top: 1px; }
    .hv-nudge-body { flex: 1; }
    .hv-nudge-text {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 6px;
    }
    .hv-nudge-names {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
    }
    .hv-nudge-link {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-blue);
      text-decoration: none;
      border: 1px solid rgba(75,191,224,0.3);
      border-radius: 6px;
      padding: 5px 11px;
      transition: background 0.15s;
    }
    .hv-nudge-link:hover { background: rgba(75,191,224,0.08); }
    @media (max-width: 600px) {
      .ag-header-title { font-size: 18px; }
      .hv-member-eq { font-size: 16px; }
    }
  </style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">Uni<span>Renter</span></a>
  <a href="/" class="nav-cta">Find housing</a>
</nav>

<div class="page-wrap">
  <div id="page-content">
    <div class="state-card" id="loading-state">
      <div class="state-icon">📋</div>
      <div>Loading house rules…</div>
    </div>
  </div>
</div>

<script>
(function() {
  // Extract token from URL: /house-rules/TOKEN
  var token = window.location.pathname.split('/house-rules/')[1];
  if (!token) {
    showError('No agreement found at this URL.');
    return;
  }

  fetch('/api/household/agreement-view?token=' + encodeURIComponent(token))
  .then(function(r) {
    if (r.status === 404) return null;
    return r.json();
  })
  .then(function(d) {
    if (!d || !d.ok) {
      showError('This house rules link has expired or doesn\'t exist.');
      return;
    }
    renderAgreement(d.agreement, d.members || []);
  })
  .catch(function() {
    showError('Could not load house rules. Check your connection and try again.');
  });

  var CAT_LABELS = {
    rent:'💰 Rent & Bills', quiet:'🛏️ Quiet Hours', cleaning:'🧹 Cleaning',
    kitchen:'🍳 Kitchen', pets:'🐾 Pets', guests:'🎉 Guests',
    moving:'📦 Moving Out', maintenance:'🔧 Maintenance', parking:'🚗 Parking',
    comms:'💬 House Comms', dispute:'⚡ Dispute Process', head_tenant:'🔑 Head Tenant'
  };

  function renderAgreement(agreement, members) {
    var clauses = agreement.clauses || [];
    var lockedDate = agreement.locked_at
      ? new Date(agreement.locked_at).toLocaleDateString('en-AU', { day:'numeric', month:'long', year:'numeric' })
      : '';

    var tierNames = { 1:'Quick Rules', 2:'House Rules', 3:'Full House Manual' };
    var tierName  = tierNames[agreement.tier] || 'House Rules';

    var publicUrl = window.location.href;

    // Members row
    var membersHtml = members.map(function(m) {
      return '<div class="ag-member-chip">' +
        '<span class="ag-member-emoji">' + (m.vibe_emoji || '🏠') + '</span>' +
        '<span>' + escHtml(m.display_name || m.email.split('@')[0]) + '</span>' +
      '</div>';
    }).join('');

    // House vibe equation — only render if at least one member has vibe data
    var vibeMembers = members.filter(function(m) {
      return m.vibe_emoji_primary || m.vibe_emoji_secondary;
    });
    var noVibeMembers = members.filter(function(m) {
      return !m.vibe_emoji_primary && !m.vibe_emoji_secondary;
    });
    var houseVibeHtml = '';
    if (vibeMembers.length > 0) {
      var eqParts = vibeMembers.map(function(m, i) {
        var primary   = m.vibe_emoji_primary   || m.vibe_emoji || '🏠';
        var secondary = m.vibe_emoji_secondary || '';
        var name      = escHtml((m.display_name || m.email.split('@')[0]).split(' ')[0]);
        var chip = '<div class="hv-member-eq">' +
          primary + (secondary ? '+' + secondary : '') +
          '<span class="hv-member-name">' + name + '</span>' +
        '</div>';
        return chip;
      });
      // Join chips with a subtle divider between them
      var eqHtml = '';
      eqParts.forEach(function(chip, i) {
        eqHtml += chip;
        if (i < eqParts.length - 1) {
          eqHtml += '<span class="hv-divider">/</span>';
        }
      });
      // Nudge for members who haven't done the quiz
      var nudgeHtml = '';
      if (noVibeMembers.length > 0) {
        var missingNames = noVibeMembers.map(function(m) {
          return (m.display_name || m.email.split('@')[0]).split(' ')[0];
        });
        var nameList = missingNames.length === 1
          ? missingNames[0]
          : missingNames.slice(0, -1).join(', ') + ' and ' + missingNames[missingNames.length - 1];
        var plural = missingNames.length > 1;
        nudgeHtml =
          '<div class="hv-nudge">' +
            '<div class="hv-nudge-icon">🤠</div>' +
            '<div class="hv-nudge-body">' +
              '<div class="hv-nudge-names">' + escHtml(nameList) +
                (plural ? ' haven\'t' : ' hasn\'t') + ' done the vibe quiz yet</div>' +
              '<div class="hv-nudge-text">' +
                'The vibe quiz takes 2 minutes and helps future housemates understand the house personality before they apply. ' +
                'It\'s free — Cob asks 5 quick questions and writes ' +
                (plural ? 'their' : 'their') + ' profile summary.' +
              '</div>' +
              '<a class="hv-nudge-link" href="/">Take the quiz →</a>' +
            '</div>' +
          '</div>';
      }

      houseVibeHtml =
        '<div class="hv-block" id="hv-block">' +
          '<div class="hv-label">🤠 House vibe</div>' +
          '<div class="hv-equation">' + eqHtml + '</div>' +
          '<div class="hv-summary" id="hv-summary">Asking Cob…</div>' +
          '<div class="hv-cob-credit" id="hv-cob-credit"></div>' +
          nudgeHtml +
        '</div>';
    }

    // Group clauses by category
    var grouped = {};
    clauses.forEach(function(c) {
      var cat = c.category || 'general';
      if (!grouped[cat]) grouped[cat] = [];
      grouped[cat].push(c);
    });

    var clauseHtml = '';
    Object.keys(grouped).forEach(function(cat) {
      clauseHtml += '<div class="ag-section-head">' + (CAT_LABELS[cat] || cat) + '</div>';
      grouped[cat].forEach(function(c) {
        clauseHtml +=
          '<div class="ag-clause-card">' +
            '<div class="ag-clause-head">' +
              '<span class="ag-clause-emoji">' + (c.emoji || '✓') + '</span>' +
              '<span class="ag-clause-title">' + escHtml(c.title) + '</span>' +
            '</div>' +
            '<div class="ag-clause-value">' +
              (c.value
                ? escHtml(c.value)
                : '<span class="ag-no-value">Not specified</span>') +
            '</div>' +
          '</div>';
      });
    });

    document.title = 'House Rules — ' + tierName + ' — UniRenter';

    document.getElementById('page-content').innerHTML =
      // Header
      '<div class="ag-header">' +
        '<div class="ag-header-top">' +
          '<span class="ag-header-icon">🏠</span>' +
          '<div>' +
            '<div class="ag-header-title">' + escHtml(tierName) + '</div>' +
            '<div class="ag-header-sub">Household agreement via UniRenter</div>' +
          '</div>' +
        '</div>' +
        (agreement.locked_at
          ? '<div class="ag-locked-badge">🔒 Locked · ' + escHtml(lockedDate) + '</div><br>'
          : '') +
        (membersHtml ? '<div class="ag-members-row">' + membersHtml + '</div>' : '') +
      '</div>' +
      // House vibe (if members have vibe data)
      (houseVibeHtml || '') +
      // Disclaimer
      '<div class="ag-disclaimer">' +
        '<strong>This is not a legally binding document.</strong> It works because everyone agreed to it — not because of anything written here. If something\'s not working, talk to each other first.' +
      '</div>' +
      // Clauses
      clauseHtml +
      // Share strip
      '<div class="ag-share-strip">' +
        '<span class="ag-share-strip-icon">📤</span>' +
        '<div class="ag-share-strip-body">' +
          '<div class="ag-share-strip-title">Share with family or housemates</div>' +
          '<div class="ag-share-strip-sub">' + escHtml(publicUrl) + '</div>' +
        '</div>' +
        '<button class="ag-copy-btn" id="ag-copy-btn">Copy link</button>' +
      '</div>' +
      // CTA
      '<div class="ag-cta-footer">' +
        '<p>UniRenter helps students find accommodation and manage their tenancy in Australia.</p>' +
        '<a href="/">Find housing →</a>' +
      '</div>' +
      // Footer
      '<div class="page-footer">' +
        '<p>© UniRenter · <a href="/legal">Legal</a> · <a href="/">unirenter.com.au</a></p>' +
      '</div>';

    // House vibe — Cob summary call
    if (vibeMembers.length > 0) {
      var summaries = vibeMembers.map(function(m) {
        var name = (m.display_name || m.email.split('@')[0]).split(' ')[0];
        var primary   = m.vibe_emoji_primary   || m.vibe_emoji || '';
        var secondary = m.vibe_emoji_secondary || '';
        var summary   = m.cob_summary || '';
        return name + ' (' + primary + (secondary ? '+' + secondary : '') + ')' +
          (summary ? ': ' + summary : '');
      }).join(' | ');

      fetch('/api/cob', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          purpose: 'household_vibe',
          members: vibeMembers.map(function(m) {
            return {
              name: (m.display_name || m.email.split('@')[0]).split(' ')[0],
              vibe_emoji_primary:   m.vibe_emoji_primary   || m.vibe_emoji || '',
              vibe_emoji_secondary: m.vibe_emoji_secondary || '',
              cob_summary:          m.cob_summary || ''
            };
          })
        })
      })
      .then(function(r) { return r.ok ? r.json() : null; })
      .then(function(data) {
        var el = document.getElementById('hv-summary');
        var cr = document.getElementById('hv-cob-credit');
        if (!el) return;
        var txt = (data && data.household_summary) ? data.household_summary : '';
        el.textContent = txt || '';
        if (txt && cr) {
          cr.textContent = 'Written by Cob 🤠';
        } else if (el) {
          el.style.display = 'none';
        }
      })
      .catch(function() {
        var el = document.getElementById('hv-summary');
        if (el) el.style.display = 'none';
      });
    }

    // Wire copy button
    var copyBtn = document.getElementById('ag-copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', function() {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(publicUrl).then(function() {
            copyBtn.textContent = 'Copied!';
            setTimeout(function() { copyBtn.textContent = 'Copy link'; }, 2000);
          });
        } else {
          // Fallback
          var ta = document.createElement('textarea');
          ta.value = publicUrl;
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
          copyBtn.textContent = 'Copied!';
          setTimeout(function() { copyBtn.textContent = 'Copy link'; }, 2000);
        }
      });
    }
  }

  function showError(msg) {
    document.getElementById('page-content').innerHTML =
      '<div class="state-card">' +
        '<div class="state-icon">🏠</div>' +
        '<div style="color:var(--text-muted);margin-bottom:16px;">' + escHtml(msg) + '</div>' +
        '<a href="/" style="color:var(--brand-blue);font-size:13px;">← Back to UniRenter</a>' +
      '</div>';
  }

  function escHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;');
  }
})();
</script>
</body>
</html>
