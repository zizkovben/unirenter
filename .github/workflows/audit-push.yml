name: Link Audit (Push)
 
on:
  push:
    branches:
      - main
  workflow_dispatch:
 
jobs:
  audit-internal:
    name: Internal Link Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
 
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
 
      - name: Run internal link audit
        id: audit
        run: |
          python3 - << 'PYEOF'
          import os, re, json, sys
 
          REPO_ROOT = os.getcwd()
 
          # ── vercel.json rewrite map ─────────────────────────────────────
          vercel_path = os.path.join(REPO_ROOT, 'vercel.json')
          rewrite_map = {}
          if os.path.exists(vercel_path):
              with open(vercel_path) as f:
                  vcfg = json.load(f)
              for rw in vcfg.get('rewrites', []):
                  src = rw.get('source','')
                  dst = rw.get('destination','')
                  # strip leading slash and trailing wildcards for simple lookup
                  key = src.lstrip('/').rstrip('/:*').split('/:')[0]
                  rewrite_map[key] = dst.lstrip('/')
 
          # ── resolve an internal path to a file on disk ──────────────────
          def file_exists_for_path(path):
              clean = path.split('?')[0].split('#')[0].lstrip('/')
              # API routes → always valid
              if clean.startswith('api/') or clean.startswith('api'):
                  return True
              # Direct file reference
              candidate = os.path.join(REPO_ROOT, clean)
              if os.path.isfile(candidate):
                  return True
              # Try rewrite map (exact key and prefix key)
              for key, dst in rewrite_map.items():
                  if clean == key or clean.startswith(key + '/'):
                      resolved = os.path.join(REPO_ROOT, dst)
                      if os.path.isfile(resolved):
                          return True
              # Try appending .html
              if not clean.endswith('.html'):
                  if os.path.isfile(candidate + '.html'):
                      return True
              # Dynamic token routes — e.g. /vibe/TOKEN, /listing/TOKEN
              dynamic_prefixes = [
                  'vibe/', 'listing/', 'house-rules/', 'review/',
                  'unsubscribe', 'dashboard', 'agent-portal', 'admin',
                  'cob', 'about', 'guide', 'lease', 'settled', 'landlords',
                  'legal', 'auth', 'find',
              ]
              for pfx in dynamic_prefixes:
                  if clean == pfx or clean.startswith(pfx + '/') or clean.startswith(pfx):
                      return True
              # City sub-paths
              cities = ['melbourne','sydney','brisbane','adelaide','perth','canberra']
              parts = clean.split('/')
              if parts and parts[0] in cities:
                  return True
              return False
 
          # ── scan HTML files ──────────────────────────────────────────────
          HREF_RE    = re.compile(r'''href=['"]([^'"#?][^'"]*?)['"]''')
          WLOC_RE    = re.compile(r'''window\.location\s*=\s*['"]([^'"]+?)['"]''')
          SRC_RE     = re.compile(r'''src=['"]([^'"]+?)['"]''')
          ACTION_RE  = re.compile(r'''action=['"]([^'"]+?)['"]''')
 
          broken = []
          total_ok = 0
          total_broken = 0
          html_files = []
 
          for dirpath, _, filenames in os.walk(REPO_ROOT):
              for fname in filenames:
                  if not fname.endswith('.html'):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, fname), REPO_ROOT)
                  # Skip node_modules
                  if 'node_modules' in rel:
                      continue
                  html_files.append(rel)
                  with open(os.path.join(dirpath, fname), encoding='utf-8', errors='ignore') as fh:
                      content = fh.read()
 
                  links = set()
                  for m in HREF_RE.finditer(content):
                      links.add(m.group(1))
                  for m in WLOC_RE.finditer(content):
                      links.add(m.group(1))
 
                  for link in links:
                      # Skip external, mailto, tel, JS, data URIs, fragments, template literals
                      if (link.startswith('http') or link.startswith('mailto:')
                              or link.startswith('tel:') or link.startswith('javascript:')
                              or link.startswith('data:') or link.startswith('#')
                              or '${' in link or link.startswith('//')):
                          continue
                      # Skip empty
                      if not link.strip():
                          continue
                      if file_exists_for_path(link):
                          total_ok += 1
                      else:
                          total_broken += 1
                          broken.append({'file': rel, 'link': link})
 
          # ── report ───────────────────────────────────────────────────────
          print(f'\nUniRenter Internal Link Audit')
          print(f'HTML files scanned : {len(html_files)}')
          print(f'Links OK           : {total_ok}')
          print(f'Links BROKEN       : {total_broken}')
 
          if broken:
              print('\nBROKEN LINKS:')
              for b in broken:
                  print(f"  {b['file']}  →  {b['link']}")
              # Write to file for email step
              with open('/tmp/audit_broken.json', 'w') as f:
                  json.dump({
                      'html_files_checked': len(html_files),
                      'internal_ok': total_ok,
                      'internal_broken': total_broken,
                      'broken_links': [f"{b['file']} → {b['link']}" for b in broken]
                  }, f)
              sys.exit(1)
          else:
              print('\n✅ All internal links OK')
              sys.exit(0)
          PYEOF
 
      - name: Send failure email via Resend
        if: failure() && steps.audit.outcome == 'failure'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import os, json, urllib.request, urllib.error
 
          api_key = os.environ.get('RESEND_API_KEY', '')
          if not api_key:
              print('No RESEND_API_KEY — skipping email')
              exit(0)
 
          broken_data = {}
          try:
              with open('/tmp/audit_broken.json') as f:
                  broken_data = json.load(f)
          except Exception:
              pass
 
          broken_links = broken_data.get('broken_links', [])
          html_files   = broken_data.get('html_files_checked', '?')
          internal_ok  = broken_data.get('internal_ok', '?')
          broken_count = broken_data.get('internal_broken', len(broken_links))
 
          link_list = ''.join(f'<li style="font-family:monospace;font-size:13px;margin:4px 0">{l}</li>' for l in broken_links)
 
          body = f"""
          <div style="font-family:Inter,sans-serif;max-width:560px;margin:0 auto;color:#0d1f2d">
            <div style="background:#0d1f2d;padding:20px 24px;border-radius:8px 8px 0 0">
              <span style="color:#F5B800;font-weight:700;font-size:18px">UniRenter</span>
              <span style="color:#aaa;font-size:14px;margin-left:8px">Audit Alert</span>
            </div>
            <div style="background:#fff;padding:24px;border:1px solid #e5e7eb;border-top:none;border-radius:0 0 8px 8px">
              <h2 style="margin:0 0 8px;color:#E8623A">⚠️ Internal links broken on push</h2>
              <p style="color:#555;margin:0 0 16px">A push to <strong>main</strong> triggered the link audit.
                 <strong>{broken_count} broken internal link(s)</strong> were detected.</p>
              <table style="width:100%;border-collapse:collapse;margin-bottom:16px">
                <tr>
                  <td style="padding:6px 12px;background:#f9fafb;border:1px solid #e5e7eb;font-size:13px">HTML files scanned</td>
                  <td style="padding:6px 12px;background:#f9fafb;border:1px solid #e5e7eb;font-size:13px;font-weight:600">{html_files}</td>
                </tr>
                <tr>
                  <td style="padding:6px 12px;border:1px solid #e5e7eb;font-size:13px">Links OK</td>
                  <td style="padding:6px 12px;border:1px solid #e5e7eb;font-size:13px;color:#3DAA5C;font-weight:600">{internal_ok}</td>
                </tr>
                <tr>
                  <td style="padding:6px 12px;background:#fff5f5;border:1px solid #e5e7eb;font-size:13px">Links broken</td>
                  <td style="padding:6px 12px;background:#fff5f5;border:1px solid #e5e7eb;font-size:13px;color:#E8623A;font-weight:600">{broken_count}</td>
                </tr>
              </table>
              <h3 style="margin:0 0 8px;font-size:14px">Broken links:</h3>
              <ul style="margin:0 0 20px;padding-left:20px">{link_list}</ul>
              <p style="font-size:12px;color:#888;margin:0">Check the <a href="https://github.com/zizkovben/unirenter/actions" style="color:#4BBFE0">GitHub Actions run</a> for full details.</p>
            </div>
          </div>
          """
 
          payload = json.dumps({
              'from': 'UniRenter Audit <noreply@unirenter.com.au>',
              'to': ['benjcarey75@gmail.com'],
              'subject': f'⚠️ UniRenter: {broken_count} broken internal link(s) detected on push',
              'html': body
          }).encode()
 
          req = urllib.request.Request(
              'https://api.resend.com/emails',
              data=payload,
              headers={'Authorization': f'Bearer {api_key}', 'Content-Type': 'application/json'}
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  print('Email sent:', resp.status)
          except urllib.error.HTTPError as e:
              print('Email send failed:', e.code, e.read().decode())
          PYEOF
 
